<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rubikon — 3D Arena</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>

    <div class="crosshair" id="crosshair"></div>

    <div class="death-overlay hidden" id="death-overlay">
      <div class="death-card">
        <div class="death-title">ВЫ ПОВЕРЖЕНЫ</div>
        <div class="death-sub">Возрождение через <span id="respawn-timer">3.0</span> с</div>
      </div>
    </div>

    <header class="hud-top">
      <div class="brand-card">
        <div class="status-dot" id="status-dot"></div>
        <div class="brand-info">
          <span class="brand-title">Rubikon 3D</span>
          <span class="status-text" id="status-text">Подключение...</span>
        </div>
        <span class="role-badge" id="role-badge">P2P</span>
      </div>

      <div class="hud-actions">
        <span class="kills-badge" id="kills-text" title="Победы">⚔ 0</span>
        <button class="hud-btn" id="btn-copy-link" type="button" title="Скопировать ссылку на комнату">
          <span>🔗 Ссылка</span>
        </button>
        <button class="hud-btn" id="btn-room" type="button" title="Комната и настройки">
          <span id="room-label">Комната</span>
        </button>
        <button class="hud-btn" id="btn-bots" type="button" title="Включить или убрать ботов">
          <span>+ Боты</span>
        </button>
        <button class="hud-btn icon-btn" id="btn-sound" type="button" title="Звук">
          <span id="sound-icon">🔊</span>
        </button>
      </div>
    </header>

    <aside class="party-panel" id="party-panel">
      <div class="party-header">
        <span>Бойцы</span>
        <span class="party-count" id="party-count">1</span>
      </div>
      <ul class="party-list" id="party-list"></ul>
    </aside>

    <div class="hud-bottom">
      <div class="hp-bar-wrap">
        <div class="hp-bar-bg">
          <div class="hp-bar-fill" id="hp-fill" style="width: 100%"></div>
        </div>
        <span class="hp-bar-text" id="hp-text">100 / 100</span>
      </div>

      <div class="emote-bar">
        <button class="emote-btn" data-emote="👋" type="button">👋</button>
        <button class="emote-btn" data-emote="🔥" type="button">🔥</button>
        <button class="emote-btn" data-emote="😂" type="button">😂</button>
        <button class="emote-btn" data-emote="⭐" type="button">⭐</button>
      </div>
      <div class="controls-hint">
        <span>WASD — идти</span>
        <span>Мышь — обзор</span>
        <span>ЛКМ — удар</span>
        <span>Пробел — прыжок</span>
        <span>Shift — рывок</span>
        <span>Esc — курсор</span>
      </div>
    </div>

    <div class="joystick-zone" id="joystick-zone">
      <div class="joystick-base" id="joystick-base">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
    </div>

    <div class="modal-backdrop hidden" id="room-modal">
      <div class="modal-card">
        <h2 class="modal-title">Rubikon — Настройки</h2>
        <div class="field-group">
          <label for="input-name">Имя игрока</label>
          <input id="input-name" type="text" maxlength="18" placeholder="Игрок">
        </div>
        <div class="field-group">
          <label for="input-room">Код комнаты (первый зашедший — хост)</label>
          <div class="input-row">
            <input id="input-room" type="text" maxlength="24" placeholder="rubikon-party">
            <button class="primary-btn" id="btn-copy-room" type="button">Ссылка</button>
          </div>
        </div>
        <div class="field-group">
          <label for="input-server">WebSocket-сервер (пусто = авто P2P)</label>
          <input id="input-server" type="text" maxlength="140" placeholder="Оставь пустым для P2P">
        </div>
        <div class="field-group">
          <label>Цвет</label>
          <div class="color-picker" id="color-picker"></div>
        </div>
        <div class="modal-footer">
          <button class="ghost-btn" id="btn-close-modal" type="button">Закрыть</button>
          <button class="primary-btn" id="btn-apply-room" type="button">Применить</button>
        </div>
      </div>
    </div>

    <div class="toast hidden" id="toast"></div>
  </div>

  <script>
    (function () {
      function loadScript(urls) {
        return new Promise(function (resolve, reject) {
          var idx = 0;
          function next() {
            if (idx >= urls.length) {
              reject(new Error("Failed to load script"));
              return;
            }
            var s = document.createElement("script");
            s.src = urls[idx++];
            s.onload = resolve;
            s.onerror = next;
            document.head.appendChild(s);
          }
          next();
        });
      }

      var params = new URLSearchParams(window.location.search);
      var inDiscord =
        (params.has("frame_id") && params.has("instance_id")) ||
        window.location.hostname.endsWith(".discordsays.com");

      var tasks = inDiscord
        ? [
            loadScript([
              "vendor/three.min.js",
              "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
              "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
            ])
          ]
        : [
            loadScript([
              "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
              "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
            ]),
            loadScript([
              "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js",
              "https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"
            ]).catch(function () {})
          ];

      Promise.all(tasks).then(function () {
        var m = document.createElement("script");
        m.type = "module";
        m.src = "js/main.js";
        document.body.appendChild(m);
      });
    })();
  </script>
</body>
</html>

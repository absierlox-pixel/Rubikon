<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Рубикон</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div class="crosshair" id="crosshair"></div>

    <!-- GTA 5 Radial Weapon Wheel (Key B) -->
    <div class="weapon-wheel hidden" id="weapon-wheel">
      <div class="wheel-container">
        <div class="wheel-ring" id="wheel-ring"></div>
        <div class="wheel-center">
          <div class="wheel-weapon-name" id="wheel-weapon-name">Кулаки</div>
          <div class="wheel-weapon-ammo" id="wheel-weapon-ammo">Ближний бой</div>
          <div class="wheel-stats">
            <div class="stat-row">
              <span>Урон</span>
              <div class="stat-track"><div class="stat-fill" id="stat-damage"></div></div>
            </div>
            <div class="stat-row">
              <span>Темп</span>
              <div class="stat-track"><div class="stat-fill" id="stat-rate"></div></div>
            </div>
            <div class="stat-row">
              <span>Дальн.</span>
              <div class="stat-track"><div class="stat-fill" id="stat-range"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function loadScript(urls) {
        return new Promise(function (resolve, reject) {
          var idx = 0;
          function next() {
            if (idx >= urls.length) {
              reject(new Error("Failed to load script"));
              return;
            }
            var s = document.createElement("script");
            s.src = urls[idx++];
            s.onload = resolve;
            s.onerror = next;
            document.head.appendChild(s);
          }
          next();
        });
      }

      var params = new URLSearchParams(window.location.search);
      var inDiscord =
        (params.has("frame_id") && params.has("instance_id")) ||
        window.location.hostname.endsWith(".discordsays.com");

      var tasks = inDiscord
        ? [
            loadScript([
              "vendor/three.min.js",
              "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
              "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
            ])
          ]
        : [
            loadScript([
              "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
              "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
            ]),
            loadScript([
              "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js",
              "https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"
            ]).catch(function () {})
          ];

      Promise.all(tasks).then(function () {
        var m = document.createElement("script");
        m.type = "module";
        m.src = "js/main.js";
        document.body.appendChild(m);
      });
    })();
  </script>
</body>
</html>

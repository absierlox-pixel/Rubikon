<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Рубикон</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div class="crosshair" id="crosshair"></div>

    <!-- AWP Sniper Scope Overlay (RMB with AWP) -->
    <div class="scope-overlay hidden" id="scope-overlay">
      <div class="scope-ring">
        <div class="scope-line-h"></div>
        <div class="scope-line-v"></div>
      </div>
    </div>

    <!-- Top-Left Player HP Bar -->
    <div class="hp-hud" id="hp-hud">
      <div class="hp-label">HP <span id="hp-text">100</span></div>
      <div class="hp-track"><div class="hp-fill" id="hp-fill"></div></div>
    </div>

    <!-- Bottom-Left Small Copy Logs Button -->
    <button class="copy-logs-btn" id="copy-logs-btn" type="button" title="Скопировать логи подключения">Логи</button>

    <!-- F3 Lobby & Connection Modal -->
    <div class="lobby-modal hidden" id="lobby-modal">
      <div class="lobby-card">
        <div class="lobby-header">
          <span>Лобби и подключение</span>
          <button class="lobby-close" id="lobby-close-btn" type="button">✕</button>
        </div>
        <div class="lobby-status" id="lobby-status">Статус: подключение...</div>
        <div class="lobby-row">
          <label for="lobby-room-input">Комната (ID)</label>
          <input id="lobby-room-input" type="text" placeholder="rubikon-party" maxlength="32">
        </div>
        <div class="lobby-row">
          <label for="lobby-ws-input">WS Сервер (необязательно)</label>
          <input id="lobby-ws-input" type="text" placeholder="wss://...">
        </div>
        <div class="lobby-actions">
          <button id="lobby-connect-btn" class="lobby-btn primary" type="button">Подключиться</button>
          <button id="lobby-copy-link-btn" class="lobby-btn" type="button">Копировать ссылку</button>
          <button id="lobby-bots-btn" class="lobby-btn" type="button">Боты: ВКЛ</button>
        </div>
        <div class="lobby-players-title">Игроки в сессии:</div>
        <ul class="lobby-players-list" id="lobby-players-list"></ul>
      </div>
    </div>

    <!-- Minimal Weapon Ammo HUD (Bottom-Right, Arial Black) -->
    <div class="ammo-hud hidden" id="ammo-hud">30/120</div>

    <!-- Vehicle Enter Prompt & Speedometer HUD -->
    <div class="car-prompt hidden" id="car-prompt">[F] Сесть</div>
    <div class="speed-hud hidden" id="speed-hud">
      <div class="speed-val" id="speed-val">0 <span class="speed-unit">КМ/Ч</span></div>
      <div class="car-hp-track"><div class="car-hp-fill" id="car-hp-fill"></div></div>
    </div>

    <!-- GTA 5 Radial Weapon Wheel (Key B) -->
    <div class="weapon-wheel hidden" id="weapon-wheel">
      <div class="wheel-container">
        <div class="wheel-ring" id="wheel-ring"></div>
        <div class="wheel-center">
          <div class="wheel-weapon-name" id="wheel-weapon-name">Кулаки</div>
          <div class="wheel-weapon-ammo" id="wheel-weapon-ammo">Ближний бой</div>
          <div class="wheel-stats">
            <div class="stat-row">
              <span>Урон</span>
              <div class="stat-track"><div class="stat-fill" id="stat-damage"></div></div>
            </div>
            <div class="stat-row">
              <span>Темп</span>
              <div class="stat-track"><div class="stat-fill" id="stat-rate"></div></div>
            </div>
            <div class="stat-row">
              <span>Дальн.</span>
              <div class="stat-track"><div class="stat-fill" id="stat-range"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      function loadScript(urls) {
        return new Promise(function (resolve, reject) {
          var idx = 0;
          function next() {
            if (idx >= urls.length) {
              reject(new Error("Failed to load script"));
              return;
            }
            var s = document.createElement("script");
            s.src = urls[idx++];
            s.onload = resolve;
            s.onerror = next;
            document.head.appendChild(s);
          }
          next();
        });
      }

      var params = new URLSearchParams(window.location.search);
      var inDiscord =
        (params.has("frame_id") && params.has("instance_id")) ||
        window.location.hostname.endsWith(".discordsays.com");

      var tasks = inDiscord
        ? [
            loadScript([
              "vendor/three.min.js",
              "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
              "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
            ])
          ]
        : [
            loadScript([
              "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
              "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
            ]),
            loadScript([
              "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js",
              "https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"
            ]).catch(function () {})
          ];

      Promise.all(tasks).then(function () {
        var m = document.createElement("script");
        m.type = "module";
        m.src = "js/main.js";
        document.body.appendChild(m);
      });
    })();
  </script>
</body>
</html>
